<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2263" width="1600" height="2263">
  <defs>
    <!-- Solid Black Minimalist Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Clean Minimalist Pure White Background -->
  <rect width="1600" height="2263" fill="#FFFFFF"/>

  <!-- ========================================== -->
  <!-- ASSOCIATION LINKS (Solid Black Lines, 2px) -->
  <!-- ========================================== -->
  <g stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Link 1: Developer to WebDashboard (Horizontal across top) -->
    <line x1="450" y1="270" x2="960" y2="270"/>

    <!-- Link 2: Developer to NoirAgent (Vertical in Col 1) -->
    <line x1="380" y1="390" x2="380" y2="700"/>

    <!-- Link 3: WebDashboard to BackendAPI (Vertical in Col 2) -->
    <line x1="1150" y1="330" x2="1150" y2="700"/>

    <!-- Link 4: NoirAgent to BackendAPI (Horizontal across middle) -->
    <line x1="560" y1="760" x2="960" y2="760"/>

    <!-- Link 5: BackendAPI to Database (Vertical on right) -->
    <line x1="1290" y1="810" x2="1290" y2="1300"/>

    <!-- Link 6: BackendAPI to ReportEngine (Vertical in middle-right) -->
    <line x1="970" y1="810" x2="970" y2="1300"/>

    <!-- Link 7: ReportEngine to Database (Horizontal between them) -->
    <line x1="1070" y1="1360" x2="1190" y2="1360"/>

    <!-- Link 8: NoirAgent to TargetContainer (Direct Vertical Highway on Col 1 left) -->
    <line x1="250" y1="810" x2="250" y2="1900"/>

    <!-- Link 9: NoirAgent to HealthProber (Stepped Corridor) -->
    <path d="M 480 810 L 480 960 L 600 960 L 600 1300" fill="none"/>

    <!-- Link 10: HealthProber to TargetContainer (Direct Vertical Highway on Col 1 right) -->
    <line x1="680" y1="1420" x2="680" y2="1900"/>
  </g>

  <!-- ========================================== -->
  <!-- MESSAGES & LABELED DIRECTIONAL ARROWS -->
  <!-- Strictly Horizontal & Completely Decoupled -->
  <!-- ========================================== -->

  <!-- LINK 1: Developer <-> WebDashboard -->
  <!-- 1: configureExperiment() -> -->
  <line x1="490" y1="230" x2="920" y2="230" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="705" y="218" font-family="'DejaVu Sans', sans-serif" font-size="14.5" font-weight="700" fill="#000000" text-anchor="middle">1: configureExperiment(target, faultSpec)</text>

  <!-- <- 8: displayResilienceReport() -->
  <line x1="920" y1="310" x2="490" y2="310" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="705" y="335" font-family="'DejaVu Sans', sans-serif" font-size="14.5" font-weight="700" fill="#000000" text-anchor="middle">8: displayResilienceReport(resilienceScore, findings)</text>


  <!-- LINK 2: Developer <-> NoirAgent -->
  <!-- 1a: CLI command downward -->
  <line x1="405" y1="440" x2="405" y2="660" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="420" y="540" font-family="'DejaVu Sans', sans-serif" font-size="13.5" font-weight="700" fill="#000000">1a: noir fault inject (CLI)</text>
  <text x="420" y="565" font-family="'DejaVu Sans', sans-serif" font-size="12" fill="#000000">    [--target api --delay 200ms]</text>

  <!-- 8a: CLI summary upward -->
  <line x1="355" y1="660" x2="355" y2="440" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="340" y="550" font-family="'DejaVu Sans', sans-serif" font-size="13.5" font-weight="700" fill="#000000" text-anchor="end">8a: printTerminalSummary(stats)</text>


  <!-- LINK 3: WebDashboard <-> BackendAPI -->
  <!-- 1.1: POST /api/experiments/queue/ (downward) -->
  <line x1="1175" y1="380" x2="1175" y2="650" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1190" y="520" font-family="'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#000000">1.1: POST /api/experiments/queue/</text>

  <!-- <- 7: notifyCompleted (upward) -->
  <line x1="1125" y1="650" x2="1125" y2="380" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1110" y="520" font-family="'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="end">7: notifyCompleted(reportId)</text>


  <!-- LINK 4: NoirAgent <-> BackendAPI -->
  <!-- Upper Pair (Job Polling & Dispatch) -->
  <line x1="600" y1="720" x2="920" y2="720" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="760" y="708" font-family="'DejaVu Sans', sans-serif" font-size="13.5" font-weight="700" fill="#000000" text-anchor="middle">2: pollAndClaimJob(agentToken)</text>

  <line x1="920" y1="745" x2="600" y2="745" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="760" y="735" font-family="'DejaVu Sans', sans-serif" font-size="13.5" font-weight="700" fill="#000000" text-anchor="middle">2.2: experimentJob(faultSpec, target)</text>

  <!-- Lower Pair (Telemetry Upload & Acknowledgment) -->
  <line x1="600" y1="780" x2="920" y2="780" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="760" y="795" font-family="'DejaVu Sans', sans-serif" font-size="13.5" font-weight="700" fill="#000000" text-anchor="middle">5: postRawObservations(probeData)</text>

  <line x1="920" y1="805" x2="600" y2="805" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="760" y="822" font-family="'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">5.2: acknowledgeUpload(status=201)</text>


  <!-- LINK 5: BackendAPI <-> Database -->
  <line x1="1310" y1="870" x2="1310" y2="1240" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1325" y="980" font-family="'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#000000">1.2: insertExperiment(QUEUED)</text>
  <text x="1325" y="1050" font-family="'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#000000">2.1: updateStatus(RUNNING)</text>
  <text x="1325" y="1120" font-family="'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#000000">5.1: bulkStoreObservations(probes)</text>


  <!-- LINK 6: BackendAPI <-> ReportEngine -->
  <!-- 6: generateReport() downward -->
  <line x1="990" y1="870" x2="990" y2="1240" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1005" y="1035" font-family="'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#000000">6: generateReport(experimentId)</text>
  <text x="1005" y="1060" font-family="'DejaVu Sans', sans-serif" font-size="11.5" fill="#000000">   [evaluateHypotheses()]</text>

  <!-- <- 6.2: returnReport() upward -->
  <line x1="950" y1="1240" x2="950" y2="870" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="935" y="1045" font-family="'DejaVu Sans', sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="end">6.2: returnReport(score, findings)</text>


  <!-- LINK 7: ReportEngine <-> Database -->
  <line x1="1090" y1="1340" x2="1170" y2="1340" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1130" y="1326" font-family="'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#000000" text-anchor="middle">6.1: saveReport()</text>


  <!-- LINK 8: NoirAgent <-> TargetContainer (Left Corridor, Labels on the Right) -->
  <line x1="270" y1="890" x2="270" y2="1820" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="285" y="1530" font-family="'DejaVu Sans', sans-serif" font-size="13.5" font-weight="700" fill="#000000">4: applyFault(tc_netem / cpu_stress)</text>
  <text x="285" y="1565" font-family="'DejaVu Sans', sans-serif" font-size="13.5" font-weight="700" fill="#000000">4.4: rollbackChaos(cleanRules)</text>


  <!-- LINK 9: NoirAgent <-> HealthProber -->
  <!-- Downward Commands (Right side of x=600) -->
  <line x1="620" y1="1000" x2="620" y2="1260" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="635" y="1070" font-family="'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#000000">3: measureSteadyStateBaseline()</text>
  <text x="635" y="1130" font-family="'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#000000">4.1: measureInFaultWindow()</text>
  <text x="635" y="1190" font-family="'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#000000">4.5: measureRecoveryTime(RTO)</text>

  <!-- Upward Probe Metrics (Left side of x=600) -->
  <line x1="580" y1="1260" x2="580" y2="1000" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="565" y="1070" font-family="'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#000000" text-anchor="end">3.2: baselineMetrics(p95, avail)</text>
  <text x="565" y="1130" font-family="'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#000000" text-anchor="end">4.3: inFaultMetrics(errorRate)</text>
  <text x="565" y="1190" font-family="'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#000000" text-anchor="end">4.7: recoveryResult(streak=3)</text>


  <!-- LINK 10: HealthProber <-> TargetContainer (Right Corridor, Labels on the Right) -->
  <line x1="700" y1="1470" x2="700" y2="1840" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="715" y="1590" font-family="'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#000000">3.1: HTTP GET /health (baseline probe)</text>
  <text x="715" y="1640" font-family="'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#000000">4.2: HTTP GET /health (fault window probe)</text>
  <text x="715" y="1690" font-family="'DejaVu Sans', sans-serif" font-size="12.5" font-weight="700" fill="#000000">4.6: HTTP GET /health (recovery streak probe)</text>


  <!-- ========================================== -->
  <!-- OBJECT & ACTOR NODES (Pure Black & White)  -->
  <!-- ========================================== -->

  <!-- ACTOR: Developer (UML Stick Figure) -->
  <g transform="translate(380, 200)">
    <circle cx="0" cy="20" r="22" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <line x1="0" y1="42" x2="0" y2="105" stroke="#000000" stroke-width="2"/>
    <line x1="-36" y1="60" x2="36" y2="60" stroke="#000000" stroke-width="2"/>
    <line x1="0" y1="105" x2="-30" y2="165" stroke="#000000" stroke-width="2"/>
    <line x1="0" y1="105" x2="30" y2="165" stroke="#000000" stroke-width="2"/>
    <text x="0" y="195" font-family="'DejaVu Sans', sans-serif" font-size="17" font-weight="700" fill="#000000" text-anchor="middle">Developer</text>
  </g>

  <!-- OBJECT: :WebDashboard -->
  <g transform="translate(960, 215)">
    <rect x="0" y="0" width="380" height="115" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="190" y="50" font-family="'DejaVu Sans', sans-serif" font-size="18.5" font-weight="700" fill="#000000" text-anchor="middle" text-decoration="underline">:WebDashboard</text>
    <text x="190" y="85" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#000000" text-anchor="middle">[React 19 / TypeScript SPA]</text>
  </g>

  <!-- OBJECT: :NoirAgent -->
  <g transform="translate(200, 700)">
    <rect x="0" y="0" width="360" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="180" y="48" font-family="'DejaVu Sans', sans-serif" font-size="18.5" font-weight="700" fill="#000000" text-anchor="middle" text-decoration="underline">:NoirAgent</text>
    <text x="180" y="82" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#000000" text-anchor="middle">[CLI Daemon / Docker SDK]</text>
  </g>

  <!-- OBJECT: :BackendAPI -->
  <g transform="translate(960, 700)">
    <rect x="0" y="0" width="380" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="190" y="48" font-family="'DejaVu Sans', sans-serif" font-size="18.5" font-weight="700" fill="#000000" text-anchor="middle" text-decoration="underline">:BackendAPI</text>
    <text x="190" y="82" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#000000" text-anchor="middle">[Django REST Core &amp; Channels]</text>
  </g>

  <!-- OBJECT: :HealthProber -->
  <g transform="translate(440, 1300)">
    <rect x="0" y="0" width="320" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="160" y="52" font-family="'DejaVu Sans', sans-serif" font-size="18.5" font-weight="700" fill="#000000" text-anchor="middle" text-decoration="underline">:HealthProber</text>
    <text x="160" y="88" font-family="'DejaVu Sans', sans-serif" font-size="13.5" fill="#000000" text-anchor="middle">[SteadyStateEvaluator]</text>
  </g>

  <!-- OBJECT: :ReportEngine -->
  <g transform="translate(840, 1300)">
    <rect x="0" y="0" width="230" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="115" y="52" font-family="'DejaVu Sans', sans-serif" font-size="18" font-weight="700" fill="#000000" text-anchor="middle" text-decoration="underline">:ReportEngine</text>
    <text x="115" y="88" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#000000" text-anchor="middle">[Chaos Analysis &amp; Scoring]</text>
  </g>

  <!-- OBJECT: :Database -->
  <g transform="translate(1190, 1300)">
    <rect x="0" y="0" width="200" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="100" y="52" font-family="'DejaVu Sans', sans-serif" font-size="18" font-weight="700" fill="#000000" text-anchor="middle" text-decoration="underline">:Database</text>
    <text x="100" y="88" font-family="'DejaVu Sans', sans-serif" font-size="13" fill="#000000" text-anchor="middle">[PostgreSQL / Redis Cache]</text>
  </g>

  <!-- OBJECT: :TargetContainer -->
  <g transform="translate(160, 1900)">
    <rect x="0" y="0" width="620" height="130" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="310" y="56" font-family="'DejaVu Sans', sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="middle" text-decoration="underline">:TargetContainer</text>
    <text x="310" y="94" font-family="'DejaVu Sans', sans-serif" font-size="14" fill="#000000" text-anchor="middle">[Docker Microservice / Linux Netem / Cgroups]</text>
  </g>

</svg>
