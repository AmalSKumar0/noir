[project]
name = "noir-agent"
version = "0.1.0"
description = "AI-powered reliability engineering agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "docker>=7.2.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "psutil>=7.2.2",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.26.8",
    "websockets>=17.1",
]

[project.scripts]
noir = "noir.cli:app"
